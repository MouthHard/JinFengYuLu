# ============================================================================
# Nginx 生产部署配置 - deploy/nginx.conf
# ============================================================================
#
# 【Nginx 是什么？】
# Nginx 是一个 Web 服务器/反向代理，生产环境中它负责：
# 1. 托管前端静态文件（HTML/JS/CSS/图片）
# 2. 将 /api 请求转发给后端 Node.js 服务
# 3. 压缩响应、设置缓存、保障安全
#
# 【开发环境 vs 生产环境的区别】
# 开发环境：Vite 开发服务器（localhost:5173）+ Vite proxy 代理 /api
# 生产环境：Nginx（80端口）+ Nginx proxy_pass 代理 /api
# 两者做的事情一样，只是工具不同。
#
# 【部署架构】
# 用户浏览器 → Nginx(:80) → /api/xxx → 后端 NestJS(:3000)
#                        → /其他   → 前端 dist/index.html
#
# ============================================================================

server {
    listen 80;
    server_name _;  # 备案通过后替换为你的域名（如 hesize.com www.hesize.com）

    # ============================================================================
    # 前端静态文件服务
    # ============================================================================
    # root 指向 Vite 构建产物目录（npm run build 后生成的 dist/）
    # 当用户访问 / 时，Nginx 返回 dist/index.html
    root /var/www/personal-website/dist;
    index index.html;

    # ============================================================================
    # Gzip 压缩
    # ============================================================================
    # 对文本类响应启用 gzip 压缩，减小传输体积
    # 配合 vite.config.ts 中的 viteCompression 插件，Nginx 可以直接返回 .gz 文件
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;  # 小于 1KB 的响应不压缩（压缩反而更大）
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ============================================================================
    # 后端 API 反向代理 — 【最关键的非前端逻辑】
    # ============================================================================
    # 当请求路径以 /api/ 开头时，转发到后端 NestJS 服务
    # 效果与 vite.config.ts 中的 proxy 配置完全一致
    #
    # proxy_pass → 后端服务地址
    # proxy_set_header → 将客户端的真实 IP/协议传递给后端
    #   - X-Real-IP：客户端真实 IP（Nginx 作为代理，后端看到的是 Nginx 的 IP）
    #   - X-Forwarded-For：代理链路中的所有 IP
    #   - X-Forwarded-Proto：客户端使用的协议（http/https）
    # proxy_connect_timeout → 连接后端超时时间
    # proxy_read_timeout → 读取后端响应超时时间
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ============================================================================
    # 静态资源缓存策略
    # ============================================================================
    # /assets/ 目录下的文件都带 hash 值（如 app-abc123.js）
    # 内容不变则 hash 不变，可以长期缓存（30天）
    # immutable → 告诉浏览器这个文件永远不会变，不用重新验证
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ============================================================================
    # Vue Router history 模式支持
    # ============================================================================
    # Vue Router 使用 history 模式时，URL 没有 # 号（如 /landscape/home）
    # 用户直接访问 /landscape/home 时，Nginx 需要返回 index.html，
    # 让 Vue Router 在前端解析路由并渲染对应页面
    # 如果没有这个配置，Nginx 会去找 /landscape/home 这个文件 → 404
    #
    # try_files $uri $uri/ /index.html → 先找文件，找不到就返回 index.html
    # no-cache → index.html 不缓存，确保用户总是获取最新版本
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # ============================================================================
    # 安全响应头
    # ============================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ============================================================================
    # 安全配置：禁止访问隐藏文件
    # ============================================================================
    # 如 .git、.env 等文件，防止泄露敏感信息
    location ~ /\. {
        deny all;
    }
}
